name: Windows release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Prepare verified FFmpeg tools
        run: python scripts/prepare_tools.py
      - name: Run isolated tests
        run: python tests/run_tests.py
      - name: Build and test the portable EXE
        run: python build_exe.py --download-tools
      - name: Upload verified distribution and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AuraDownloader-windows-x64
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
            dist/smoke-report.json
